<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planilla de Control – Mundial 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      padding: 12px;
    }

    .planilla {
      background: #fff;
      max-width: 1280px;
      margin: 0 auto;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }

    /* ── Header ─────────────────────────────────────────── */
    .header {
      background: #1a7c1a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      gap: 12px;
    }
    .header-left { flex: 1; }
    .header-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.1;
      text-transform: uppercase;
    }
    .header-sub {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1px;
      opacity: 0.85;
      margin-top: 2px;
    }
    .header-right {
      font-size: 9px;
      text-align: right;
      opacity: 0.7;
      white-space: nowrap;
    }

    /* ── Grid ────────────────────────────────────────────── */
    .grid {
      padding: 4px 6px 6px;
    }

    .row {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e8e8e8;
      min-height: 22px;
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: #f5fdf5; }

    .flag-cell {
      width: 28px;
      min-width: 28px;
      text-align: center;
      font-size: 16px;
      line-height: 1;
      padding: 1px 0;
    }

    .code-cell {
      width: 34px;
      min-width: 34px;
      font-size: 7.5px;
      font-weight: 700;
      text-align: center;
      color: #333;
      letter-spacing: 0.3px;
    }

    .stickers {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      padding: 2px 0 2px 2px;
      flex: 1;
    }

    .sticker {
      width: 38px;
      height: 17px;
      border: 1px solid #bbb;
      border-radius: 2px;
      font-size: 7px;
      font-weight: 600;
      text-align: center;
      line-height: 17px;
      color: #333;
      background: #fff;
      letter-spacing: 0.2px;
      user-select: none;
    }

    .sticker.pegada {
      background: #333;
      color: #fff;
      border-color: #333;
    }
    .row-fwc .sticker.pegada {
      background: #1a7c1a;
      color: #fff;
      border-color: #1a7c1a;
    }
    .row-cc .sticker.pegada {
      background: #b8860b;
      color: #fff;
      border-color: #b8860b;
    }

    /* FWC stickers – teal tint */
    .row-fwc .sticker {
      background: #e6f4ea;
      border-color: #4caf50;
      color: #1a6e1a;
    }
    .row-fwc .code-cell {
      color: #1a7c1a;
      font-size: 8px;
    }

    /* CC stickers – gold tint */
    .row-cc .sticker {
      background: #fff8e1;
      border-color: #ffc107;
      color: #7a5a00;
    }
    .row-cc .code-cell {
      color: #7a5a00;
      font-size: 8px;
    }

    /* Alternating row backgrounds (every 2 country rows) */
    .row-alt { background: #fafafa; }
    .row-alt:hover { background: #f0f8f0; }

    /* Section divider between FWC top / countries / FWC bottom+CC */
    .divider {
      height: 3px;
      background: #1a7c1a;
    }

    @media (max-width: 700px) {
      .sticker { width: 32px; height: 15px; line-height: 15px; font-size: 6.5px; }
      .header-title { font-size: 15px; }
    }

    /* ── Search ─────────────────────────────────────────── */
    .search-bar {
      padding: 8px 10px;
      background: #f4f4f4;
      border-bottom: 1px solid #ddd;
    }
    .search-bar input {
      width: 100%;
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      font-family: inherit;
    }
    .search-bar input:focus {
      border-color: #1a7c1a;
      box-shadow: 0 0 0 2px rgba(26,124,26,0.15);
    }
    .row.hidden { display: none; }

    @media print {
      .search-bar { display: none; }

      @page { size: A4 portrait; margin: 5mm; }

      /* Forzar impresión de colores de fondo */
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      body { background: white; padding: 0; }

      /* Forzar que el planilla respete el ancho del papel, no el viewport */
      .planilla { box-shadow: none; width: 100%; max-width: 100%; }

      .header { padding: 2mm 3mm; }
      .header-title { font-size: 4mm; letter-spacing: 0.5mm; }
      .header-sub { font-size: 2.2mm; margin-top: 0.5mm; }
      .header-right { font-size: 2mm; }

      .grid { padding: 0.5mm 1mm; }

      .row { min-height: 0; border-bottom-color: #ccc; }
      .row:hover { background: inherit; }

      /* A4 útil = 200mm. Flag 5mm + Code 7mm + 20 stickers × 8.5mm + 19 gaps × 0.3mm ≈ 184mm */
      .flag-cell { width: 5mm; min-width: 5mm; font-size: 2.8mm; padding: 0; }
      .code-cell  { width: 7mm; min-width: 7mm; font-size: 1.8mm; }

      .stickers { flex-wrap: nowrap; gap: 0.3mm; padding: 0.4mm 0 0.4mm 0.5mm; }

      .sticker {
        flex: none;
        width: 8.5mm;
        height: 4mm;
        line-height: 4mm;
        font-size: 1.9mm;
        border-radius: 0.4mm;
        letter-spacing: 0;
        border-width: 0.3mm;
      }

      .divider { height: 0.8mm; }
    }
  </style>
</head>

const grid = document.getElementById('grid');

function makeRow(code, flag, stickers, extraClass = '') {
  const row = document.createElement('div');
  row.className = 'row' + (extraClass ? ' ' + extraClass : '');

  const flagCell = document.createElement('div');
  flagCell.className = 'flag-cell';
  flagCell.textContent = flag;
  flagCell.title = code;
  row.appendChild(flagCell);

  const codeCell = document.createElement('div');
  codeCell.className = 'code-cell';
  codeCell.textContent = code;
  row.appendChild(codeCell);

  const stickersDiv = document.createElement('div');
  stickersDiv.className = 'stickers';

  for (const label of stickers) {
    const s = document.createElement('div');
    s.className = 'sticker' + (PEGADAS.has(label) ? ' pegada' : '');
    s.textContent = label;
    s.title = label;
    stickersDiv.appendChild(s);
  }

  row.appendChild(stickersDiv);
  return row;
}

function range(code, from, to) {
  const arr = [];
  for (let i = from; i <= to; i++) arr.push(code + i);
  return arr;
}

  row.dataset.name = c.name.toLowerCase();
  grid.appendChild(row);
  countryRows.push(row);

// ── CC (1-14) ──────────────────────────────────────────
grid.appendChild(makeRow('CC', '🏅', range('CC', 1, CC_COUNT), 'row-cc'));

// ── Search ─────────────────────────────────────────────
document.getElementById('search').addEventListener('input', function () {
  const raw = this.value.trim();
  if (!raw) {
    countryRows.forEach(r => r.classList.remove('hidden'));
    return;
  }
  let regex;
  try { regex = new RegExp(raw, 'i'); } catch { regex = new RegExp(raw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'); }
  countryRows.forEach(r => {
    const match = regex.test(r.dataset.code) || regex.test(r.dataset.name);
    r.classList.toggle('hidden', !match);
  });
});
</script>
</body>
</html>
